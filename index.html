
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Collage Page</title>
  <meta name="description" content="View this photo collage.">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: #ffffff;
      padding: 16px;
      border-radius: 10px;
    }

    h1 {
      font-size: 24px;
      color: #222222;
    }

    p {
      color: #555555;
      line-height: 1.6;
    }

    .collage {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>My Photo Collage</h1>
    <p>Take a look at this photo collage.</p>

    <img
      class="collage"
      src="collage.png"
      alt="Photo collage"
    >
  </main>
</body>
</html>
